<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220">
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dash{stroke-dasharray:14 10;animation:ds 2.4s linear infinite}
@keyframes ds{to{stroke-dashoffset:-48}}
.pu{animation:pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,50%{opacity:1}50.1%,100%{opacity:0}}
.lt{animation:lt 2.4s ease-in-out infinite}
@keyframes lt{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<g class="fl">
<rect x="6" y="10" width="168" height="200" rx="18" fill="#0d1117"/>
<rect class="dash" x="6" y="10" width="168" height="200" rx="18" fill="none" stroke="#2496ED" stroke-width="2"/>
<g transform="translate(90,88)"><rect class="lt" style="animation-delay:0.9s" x="-1" y="-34" width="18" height="16" rx="2" fill="#2496ED"/><rect class="lt" style="animation-delay:0.6s" x="-30" y="-16" width="18" height="16" rx="2" fill="#2496ED"/><rect class="lt" style="animation-delay:0.6s" x="-10" y="-16" width="18" height="16" rx="2" fill="#2496ED"/><rect class="lt" style="animation-delay:0.6s" x="10" y="-16" width="18" height="16" rx="2" fill="#2496ED"/><rect class="lt" style="animation-delay:0.3s" x="-40" y="2" width="18" height="16" rx="2" fill="#2496ED"/><rect class="lt" style="animation-delay:0.3s" x="-20" y="2" width="18" height="16" rx="2" fill="#2496ED"/><rect class="lt" style="animation-delay:0.3s" x="0" y="2" width="18" height="16" rx="2" fill="#2496ED"/><rect class="lt" style="animation-delay:0.3s" x="20" y="2" width="18" height="16" rx="2" fill="#2496ED"/><path d="M-50 24 H44 Q40 48 4 48 Q-38 48 -50 24 Z" fill="#2496ED"/><circle cx="-24" cy="34" r="3" fill="#0d1117"/></g>
<text x="90" y="170" text-anchor="middle" font-size="22" font-weight="800" fill="#e6edf3">Docker</text>
<text x="90" y="192" text-anchor="middle" font-size="12.5" fill="#8b949e">Containers</text>
</g></svg>