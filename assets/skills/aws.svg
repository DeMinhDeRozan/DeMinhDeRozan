<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220">
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dash{stroke-dasharray:14 10;animation:ds 2.4s linear infinite}
@keyframes ds{to{stroke-dashoffset:-48}}
.pu{animation:pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,50%{opacity:1}50.1%,100%{opacity:0}}
.lt{animation:lt 2.4s ease-in-out infinite}
@keyframes lt{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<g class="fl">
<rect x="6" y="10" width="168" height="200" rx="18" fill="#0d1117"/>
<rect class="dash" x="6" y="10" width="168" height="200" rx="18" fill="none" stroke="#FF9900" stroke-width="2"/>
<g transform="translate(90,88)"><g class="pu"><g fill="#FF9900"><circle cx="-24" cy="2" r="20"/><circle cx="2" cy="-12" r="28"/><circle cx="30" cy="2" r="20"/><rect x="-24" y="2" width="54" height="20"/></g>
<text x="3" y="12" text-anchor="middle" font-size="22" font-weight="800" fill="#0d1117">aws</text></g>
<path d="M-24 36 Q4 52 32 36" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round" stroke-dasharray="60" ><animate attributeName="stroke-dashoffset" values="60;0;0;60" keyTimes="0;.4;.8;1" dur="3s" repeatCount="indefinite"/></path></g>
<text x="90" y="170" text-anchor="middle" font-size="22" font-weight="800" fill="#e6edf3">AWS</text>
<text x="90" y="192" text-anchor="middle" font-size="12.5" fill="#8b949e">Cloud</text>
</g></svg>